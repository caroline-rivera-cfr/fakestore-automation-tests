image: cypress/browsers:22.15.0

stages:
  - test

before_script:
  - npm ci
  - npx cypress install
  - npx cypress verify
  - mkdir -p cypress/results/junit

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - .npm/

api_tests:
  stage: test
  script:
    - npx cypress run --reporter junit --reporter-options 'mochaFile=cypress/results/junit/results-[hash].xml,toConsole=true' --spec "cypress/e2e/api-tests/**/*.cy.js"
    - ls -la cypress/results/junit
  artifacts:
    when: always
    reports:
      junit: cypress/results/junit/*.xml
    expire_in: 1 week

ui_tests:
  stage: test
  script:
    - npx cypress run --browser chrome --config-file cypress.config.js --reporter junit --reporter-options 'mochaFile=cypress/results/junit/results-[hash].xml,toConsole=true' --spec "cypress/e2e/ui-tests/**/*.cy.js"
    - ls -la cypress/results/junit
  artifacts:
    when: always
    reports:
      junit: cypress/results/junit/*.xml
    expire_in: 1 week