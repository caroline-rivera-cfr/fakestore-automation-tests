stages:
  - test

before_script:
  - npm ci
  - npx cypress verify

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - .npm/

api_tests:
  image: node:latest
  stage: test
  script:
    - npx cypress run --spec "cypress/e2e/api-tests/**/*.cy.js"

ui_tests:
  image: cypress/included:14.5.4
  stage: test
  script:
    - npx cypress run --browser electron --config-file cypress.config.js --spec "cypress/e2e/ui-tests/**/*.cy.js"